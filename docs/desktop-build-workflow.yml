# Reference copy of the installed Windows desktop build workflow.
#
# Reference copy of the active workflow installed at .github/workflows/desktop.yml.
# It runs for push and pull requests to main and can be started manually.
# Latest verified run: https://github.com/Tygaclaw/Project-Eclipse/actions/runs/42170364882
#
# Artifact name: ECLIPSE-windows-x64
# Artifact contents: ECLIPSE-windows-x64.zip (the PyInstaller onedir ECLIPSE folder)

name: Windows desktop build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64-desktop:
    name: Windows x64 desktop package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-desktop.txt

      - name: Install pinned desktop dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt

      - name: Compile source, tests and packaging files
        run: python -m compileall -q src tests packaging

      - name: Run full test suite including desktop smoke tests
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: python .github/scripts/run_tests.py

      - name: Build Windows desktop executable with PyInstaller
        run: python -m PyInstaller --noconfirm --clean packaging/eclipse-desktop.spec

      - name: Smoke-test the packaged backend entry point
        run: dist\ECLIPSE\ECLIPSE.exe --atlas-backend --help

      - name: Create the Windows x64 zip
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist\ECLIPSE\* `
            -DestinationPath ECLIPSE-windows-x64.zip `
            -CompressionLevel Optimal

      - name: Upload the Windows x64 desktop artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ECLIPSE-windows-x64
          path: ECLIPSE-windows-x64.zip
          if-no-files-found: error
          retention-days: 14