name: ECLIPSE agent monitor

on:
  schedule:
    # GitHub-only status checks every ten minutes; no model API calls are made.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: eclipse-agent-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check OpenCode run status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MONITOR_ISSUE_NUMBER: "2"
        run: python3 .github/scripts/monitor_agent.py
