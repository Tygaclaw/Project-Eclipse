name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR' ||
       github.event.comment.author_association == 'MEMBER')
    runs-on: ubuntu-latest
    # GitHub-hosted jobs allow up to six hours. Keep a small cleanup margin.
    timeout-minutes: 350
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Select model and verify its provider credential
        id: route
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOKENHARBOR_API_KEY: ${{ secrets.TOKENHARBOR_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          provider="tokenharbor"
          model="tokenharbor/deepseek-v4.1-flash:free"

          # Match the most specific command first.
          case "$COMMENT_BODY" in
            *"/oc-dahl-deepseek"*)
              provider="dahl"
              model="dahl/deepseek-ai/DeepSeek-V4-Flash-0731"
              ;;
            *"/oc-dahl"*)
              provider="dahl"
              model="dahl/MiniMaxAI/MiniMax-M2.7"
              ;;
            *"/oc-gemini37"*)
              provider="google"
              model="google/gemini-3.7-flash"
              ;;
            *"/oc-gemini"*)
              provider="google"
              model="google/gemini-3.8-flash"
              ;;
            *"/oc-groq-qwen"*)
              provider="groq"
              model="groq/qwen/qwen3.8-27b"
              ;;
            *"/oc-groq"*)
              provider="groq"
              model="groq/openai/gpt-oss-120b"
              ;;
            *"/oc-openrouter-ultra"*)
              provider="openrouter"
              model="openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"
              ;;
            *"/oc-openrouter"*)
              provider="openrouter"
              model="openrouter/cohere/north-mini-code:free"
              ;;
            *"/oc-zai-45"*)
              provider="zai"
              model="zai/glm-4.5-flash"
              ;;
            *"/oc-zai"*)
              provider="zai"
              model="zai/glm-4.7-flash"
              ;;
            *"/oc-mimo"*)
              provider="tokenharbor"
              model="tokenharbor/mimo-v2.6-flash:free"
              ;;
          esac

          case "$provider" in
            dahl)
              credential="$DAHL_API_KEY"
              missing_name="DAHL_API_KEY"
              ;;
            google)
              credential="$GEMINI_API_KEY"
              missing_name="GEMINI_API_KEY"
              ;;
            groq)
              credential="$GROQ_API_KEY"
              missing_name="GROQ_API_KEY"
              ;;
            openrouter)
              credential="$OPENROUTER_API_KEY"
              missing_name="OPENROUTER_API_KEY"
              ;;
            tokenharbor)
              credential="$TOKENHARBOR_API_KEY"
              missing_name="TOKENHARBOR_API_KEY"
              ;;
            zai)
              credential="$ZAI_API_KEY"
              missing_name="ZAI_API_KEY"
              ;;
            *)
              echo "::error::Internal provider selection error."
              exit 1
              ;;
          esac

          if [[ -z "$credential" ]]; then
            echo "::error::Add the selected provider secret: $missing_name"
            exit 1
          fi

          {
            echo "provider=$provider"
            echo "model=$model"
          } >> "$GITHUB_OUTPUT"

          echo "Selected provider: $provider"
          echo "Selected model: $model"

      - name: Run OpenCode with the selected provider credential
        uses: anomalyco/opencode/github@latest
        env:
          # Only the selected provider's credential is passed to the agent process.
          DAHL_API_KEY: ${{ steps.route.outputs.provider == 'dahl' && secrets.DAHL_API_KEY || '' }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ steps.route.outputs.provider == 'google' && secrets.GEMINI_API_KEY || '' }}
          GROQ_API_KEY: ${{ steps.route.outputs.provider == 'groq' && secrets.GROQ_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ steps.route.outputs.provider == 'openrouter' && secrets.OPENROUTER_API_KEY || '' }}
          TOKENHARBOR_API_KEY: ${{ steps.route.outputs.provider == 'tokenharbor' && secrets.TOKENHARBOR_API_KEY || '' }}
          ZAI_API_KEY: ${{ steps.route.outputs.provider == 'zai' && secrets.ZAI_API_KEY || '' }}
        with:
          model: ${{ steps.route.outputs.model }}
          agent: build
