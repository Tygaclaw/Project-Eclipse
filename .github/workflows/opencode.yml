name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR' ||
       github.event.comment.author_association == 'MEMBER')
    runs-on: ubuntu-latest
    # GitHub-hosted jobs allow up to six hours. Keep a small cleanup margin.
    timeout-minutes: 350
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify selected provider key is present
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          TOKENHARBOR_API_KEY: ${{ secrets.TOKENHARBOR_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [[ "$COMMENT_BODY" == *"/oc-openrouter"* ]]; then
            if [ -z "$OPENROUTER_API_KEY" ]; then
              echo "::error::Add the repository Actions secret OPENROUTER_API_KEY before using /oc-openrouter."
              exit 1
            fi
          else
            if [ -z "$TOKENHARBOR_API_KEY" ]; then
              echo "::error::Add the repository Actions secret TOKENHARBOR_API_KEY before starting a Token Harbor agent run."
              exit 1
            fi
          fi

      - name: Run OpenCode with the selected free model
        uses: anomalyco/opencode/github@latest
        env:
          # Expose only the credential for the selected provider to the agent process.
          TOKENHARBOR_API_KEY: ${{ contains(github.event.comment.body, '/oc-openrouter') && '' || secrets.TOKENHARBOR_API_KEY }}
          OPENROUTER_API_KEY: ${{ contains(github.event.comment.body, '/oc-openrouter') && secrets.OPENROUTER_API_KEY || '' }}
        with:
          # Commands: /oc (DeepSeek), /oc-mimo (MiMo),
          # /oc-openrouter (Cohere North Mini Code), /oc-openrouter-flint (Recursive Flint).
          # Check the longer Flint command first because it contains /oc-openrouter.
          model: ${{ contains(github.event.comment.body, '/oc-openrouter-flint') && 'openrouter/recursive/flint-v1.0:free' || contains(github.event.comment.body, '/oc-openrouter') && 'openrouter/cohere/north-mini-code:free' || contains(github.event.comment.body, '/oc-mimo') && 'tokenharbor/mimo-v2.6-flash:free' || 'tokenharbor/deepseek-v4.1-flash:free' }}
          agent: build
