name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR' ||
       github.event.comment.author_association == 'MEMBER')
    runs-on: ubuntu-latest
    # GitHub-hosted jobs allow up to six hours. Keep a small cleanup margin.
    timeout-minutes: 350
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode with Token Harbor free models
        uses: anomalyco/opencode/github@latest
        env:
          TOKENHARBOR_API_KEY: ${{ secrets.TOKENHARBOR_API_KEY }}
        with:
          # /oc-mimo is a manual fallback if DeepSeek's free route is unavailable.
          model: ${{ contains(github.event.comment.body, '/oc-mimo') && 'tokenharbor/mimo-v2.6-flash:free' || 'tokenharbor/deepseek-v4.1-flash:free' }}
          agent: build
